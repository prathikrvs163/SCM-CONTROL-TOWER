services:
  mysql:
    image: mysql:8.4
    container_name: scm-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Database password required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-scm_control_tower}

    ports:
      - "127.0.0.1:3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql -h 127.0.0.1 -u root -D "$${MYSQL_DATABASE}" -e "SELECT 1"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - scm-network

  migration:
    image: scm-migration:1.0
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migration

    container_name: scm-migration
    restart: "no"

    environment:
      DATABASE_URL: "mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-scm_control_tower}"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - scm-network

  backend:
    image: scm-backend:1.0
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime

    container_name: scm-backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-scm_control_tower}"

    expose:
      - "3000"

    depends_on:
      mysql:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready', { signal: AbortSignal.timeout(4000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - scm-network

  frontend:
    image: scm-frontend:1.0
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api

    container_name: scm-frontend
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/health
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - scm-network

networks:
  scm-network:
    driver: bridge

volumes:
  mysql_data:
    external: true
    name: scm-control-tower_mysql_data