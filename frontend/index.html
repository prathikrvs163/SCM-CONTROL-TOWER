<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Supply chain control tower: orders, supply, allocation and fulfillment risk." />
    <title>Control Tower · Supply Chain Operations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <script>
      // Apply the saved theme before first paint to avoid a light flash.
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('scm-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          theme = saved === 'dark' || (saved !== 'light' && prefersDark) ? 'dark' : 'light';
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
